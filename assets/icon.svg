<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Switchboard</title>
  <!--
    Switchboard app icon: a patch panel with three cords crossing between two
    banks of jacks. The cord colours are the status colours the picker itself
    uses for an agent - green for busy, yellow for idle, red/terracotta for
    waiting on you.

    The outer shape is a superellipse (|x/a|^5 + |y/a|^5 = 1, a = 412) rather
    than a rounded rectangle, so it matches the macOS icon silhouette. Artwork
    fills the 824x824 macOS icon grid inside the 1024x1024 canvas.

    Regenerate the .icns from this file with scripts/make-icon.sh.
  -->
  <defs>
    <path id="body" d="M924.0,512.0 C924.0,313.0 928.6,211.3 870.7,153.3 C812.7,95.4 711.0,100.0 512.0,100.0 C313.0,100.0 211.3,95.4 153.3,153.3 C95.4,211.3 100.0,313.0 100.0,512.0 C100.0,711.0 95.4,812.7 153.3,870.7 C211.3,928.6 313.0,924.0 512.0,924.0 C711.0,924.0 812.7,928.6 870.7,870.7 C928.6,812.7 924.0,711.0 924.0,512.0 Z"/>
    <linearGradient id="panel" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3d444b"/>
      <stop offset="0.55" stop-color="#24292d"/>
      <stop offset="1" stop-color="#15181a"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="-70" x2="0" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9aa3ab"/>
      <stop offset="0.5" stop-color="#697178"/>
      <stop offset="1" stop-color="#383e43"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
    <g id="jack">
      <circle r="70" fill="url(#bezel)"/>
      <circle r="70" fill="none" stroke="#000000" stroke-opacity="0.38" stroke-width="3"/>
      <circle r="40" fill="#0d1012"/>
    </g>
    <g id="jacks">
      <use href="#jack" x="264" y="304"/>
      <use href="#jack" x="264" y="512"/>
      <use href="#jack" x="264" y="720"/>
      <use href="#jack" x="760" y="304"/>
      <use href="#jack" x="760" y="512"/>
      <use href="#jack" x="760" y="720"/>
    </g>
  </defs>

  <g filter="url(#drop)"><use href="#body" fill="url(#panel)"/></g>
  <use href="#body" fill="none" stroke="url(#rim)" stroke-width="5"/>

  <!-- Jacks are drawn twice: once under the cords, once over them, so each
       cord ends inside the dark hole of the jack it is patched into. -->
  <use href="#jacks"/>

  <g fill="none" stroke-linecap="round">
    <path d="M264,720 C454,720 570,304 760,304" stroke="#000000" stroke-opacity="0.40" stroke-width="50" transform="translate(0,11)"/>
    <path d="M264,512 C454,512 570,720 760,720" stroke="#000000" stroke-opacity="0.40" stroke-width="50" transform="translate(0,11)"/>
    <path d="M264,304 C454,304 570,512 760,512" stroke="#000000" stroke-opacity="0.40" stroke-width="50" transform="translate(0,11)"/>

    <!-- idle -->
    <path d="M264,720 C454,720 570,304 760,304" stroke="#8f6f26" stroke-width="44"/>
    <path d="M264,720 C454,720 570,304 760,304" stroke="#F0C674" stroke-width="34"/>
    <path d="M264,720 C454,720 570,304 760,304" stroke="#ffffff" stroke-opacity="0.12" stroke-width="9"/>

    <!-- busy -->
    <path d="M264,512 C454,512 570,720 760,720" stroke="#2f6b3f" stroke-width="44"/>
    <path d="M264,512 C454,512 570,720 760,720" stroke="#7BD88F" stroke-width="34"/>
    <path d="M264,512 C454,512 570,720 760,720" stroke="#ffffff" stroke-opacity="0.12" stroke-width="9"/>

    <!-- waiting -->
    <path d="M264,304 C454,304 570,512 760,512" stroke="#a34426" stroke-width="44"/>
    <path d="M264,304 C454,304 570,512 760,512" stroke="#E07C55" stroke-width="34"/>
    <path d="M264,304 C454,304 570,512 760,512" stroke="#ffffff" stroke-opacity="0.12" stroke-width="9"/>
  </g>

  <use href="#jacks"/>
</svg>
